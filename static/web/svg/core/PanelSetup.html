<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Panel Setup</title>
</head>
<body onload="">

<script src="/web/svg/core/PanelCommon.js"></script>

<script type="text/javascript">

function createTableRowForCookie(cookieNum)
{
    var cVal = cookiesDefined[cookieNum].getCookie();
    var row = "<tr>";
    row += "<td>" + cookiesDefined[cookieNum].name + "</td>";
    row += "<td>" + (cVal == "" ? ">>null<<" : cVal) + "</td>";
    row += (cVal == "" ? "<td colspan=" + '"2">' : "<td>") + createCreateCookieButton(cookieNum) + "</td>";
    row += (cVal == "" ? "" : "<td>" + createDeleteCookieButton(cookieNum) + "</td>");
    row += "<td>" + cookiesDefined[cookieNum].explanation + "</td>";
    row += "</tr>";
    return row;
}

function createCreateCookieButton(cookieNum)
{
    var s = '<button type="button" onclick="cookiesDefined[' + cookieNum + '].setCookie(3650); location=location;">Create</button>';
    
    //alert(s);
    
    return s;
}

function createDeleteCookieButton(cookieNum)
{
    var s = '<button type="button" onclick="cookiesDefined[' + cookieNum + '].deleteCookie(); location=location;">Delete</button>';
    
    //alert(s);
    
    return s;
}

</script>

<H1>Panel Setup</H1>

This page is used to set up device specific preferences through the use of browser cookies.

<table cellspacing="10">
<tr>
<th>Name</th>
<th>Value</th>
<th colspan="2">Actions</th>
<th>Use</th>
</tr>
<tbody id="cookieTableBody"></tbody>
</table>
<script>
    var rows = "";
    for(var i = 0; i < cookiesDefined.length; i++)
        rows += createTableRowForCookie(i);
    document.getElementById("cookieTableBody").insertAdjacentHTML("beforeend", rows);
</script>

<P>
<a href="/">Return to Top</a>

</body>
</html>
